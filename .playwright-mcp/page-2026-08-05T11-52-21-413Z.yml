              - button "✕"
            - generic:
              - generic:
                - generic:
                  - heading "🔧 Custodi tècnic de les dades" [level=4]
                  - paragraph: Perfil tecnològic responsable del funcionament tècnic, emmagatzematge, seguretat i disponibilitat de les dades dins dels sistemes d'informació. Implementa les decisions aprovades pel propietari i col·labora amb el gestor per garantir la integritat tècnica de la dada.
                  - paragraph:
                    - strong: "Exemple:"
                    - text: El perfil tecnològic responsable del sistema de gestió d'ajudes garanteix que la base de dades funcioni correctament, aplica els controls d'accés definits i executa les actualitzacions tècniques necessàries.
              - generic:
                - generic:
                  - heading "📋 Gestor de les dades" [level=4]
                  - paragraph: Perfil tècnic-funcional de l'àmbit de negoci responsable de la gestió operativa i quotidiana de la dada en el seu domini. Coneix el seu significat, les seves regles i casuístiques, i vetlla per la seva correcta aplicació i documentació. Actua com a enllaç entre l'àmbit de negoci i el perfil tecnològic.
                  - paragraph:
                    - strong: "Exemple:"
                    - text: El tècnic funcional de l'àrea de Cultura revisa que els registres d'equipaments culturals estiguin complets, aplica les regles de validació definides i coordina amb el perfil tecnològic la resolució d'incidències.
              - generic:
                - generic:
                  - heading "👑 Propietari de les dades" [level=4]
                  - paragraph: Unitat administrativa responsable última d'un conjunt de dades. Defineix les normes d'ús i accés, els criteris de qualitat i la prioritat de la seva evolució. Té l'autoritat final sobre les decisions relacionades amb aquella dada.
                  - paragraph:
                    - strong: "Exemple:"
                    - text: La Direcció de Serveis Socials és la propietària del registre de beneficiaris d'ajudes i decideix qui pot accedir a la informació i quins requisits de qualitat s'han de complir.
              - generic:
                - generic:
                  - heading "✅ Responsable de qualitat de les dades" [level=4]
                  - paragraph: Perfil encarregat de vetllar per la correcta definició, coherència semàntica i qualitat de les dades dins un domini.
                  - paragraph:
                    - strong: "Exemple:"
                    - text: Revisar duplicats a la base de dades de clients i corregir incoherències.
            - generic:
              - button "Tancar"
          - generic:
            - button "close"