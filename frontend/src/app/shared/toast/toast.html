<div class="toast toast-center toast-bottom z-[9999] gap-2 px-4">
  @for (t of toastService.toasts(); track t.id) {
    <div class="alert shadow-lg text-sm py-2 pl-3 pr-2 min-w-[260px] max-w-sm toast-item"
         [class.alert-success]="t.type === 'success'"
         [class.alert-error]="t.type === 'error'">
      @if (t.type === 'success') {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      }
      <span class="leading-tight">{{t.message}}</span>
      <button type="button" class="btn btn-ghost btn-xs btn-circle" (click)="toastService.dismiss(t.id)" aria-label="Tancar">✕</button>
    </div>
  }
</div>
