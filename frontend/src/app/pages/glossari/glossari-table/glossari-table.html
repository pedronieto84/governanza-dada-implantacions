<div class="card bg-base-100 shadow-xl border border-base-200">
  <div class="card-body p-0">
    <!-- Title bar -->
    <div class="flex items-center justify-between px-6 py-3 bg-base-200 rounded-t-2xl border-b border-base-300">
      <h2 class="text-2xl font-bold text-primary">Glossari</h2>
      <span class="text-sm font-semibold text-base-content/60 italic">Diputació de Barcelona</span>
    </div>

    <!-- Tabs -->
    <div role="tablist" class="tabs tabs-bordered px-4 pt-2">
      <button role="tab" class="tab font-semibold" [class.tab-active]="activeTab === 'mestres'" (click)="activeTab = 'mestres'">Dades Mestres</button>
      <button role="tab" class="tab font-semibold" [class.tab-active]="activeTab === 'referencia'" (click)="activeTab = 'referencia'">Dades de Referència</button>
      <button role="tab" class="tab font-semibold" [class.tab-active]="activeTab === 'negoci'" (click)="activeTab = 'negoci'">Dades de Negoci</button>
    </div>

    <div class="p-2 border-b border-base-300 flex justify-between items-center bg-base-100">
      <div class="font-bold text-sm text-red-800 bg-red-100 px-3 py-1 rounded">
        DADES {{ activeTab === 'mestres' ? 'MESTRES' : activeTab === 'referencia' ? 'DE REFERÈNCIA' : 'DE NEGOCI' }}
      </div>
      <button class="btn btn-primary btn-sm" (click)="addRow()">Afegir Fila</button>
    </div>

    <div class="w-full" style="height: 600px;">
      <ag-grid-angular
        style="width: 100%; height: 100%;"
        class="ag-theme-alpine"
        [rowData]="currentData"
        [columnDefs]="colDefs"
        [defaultColDef]="defaultColDef"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>

  </div>
</div>
