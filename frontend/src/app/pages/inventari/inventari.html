<div class="flex flex-col gap-6">
  <div role="tablist" class="tabs tabs-bordered bg-base-200 max-w-full overflow-x-auto" [stickyStack]="0">
    <a role="tab" class="tab whitespace-nowrap" routerLink="sistemes" routerLinkActive="tab-active font-bold text-primary border-primary">Sistemes</a>
    <a role="tab" class="tab whitespace-nowrap" routerLink="dominis-dades" routerLinkActive="tab-active font-bold text-primary border-primary">Dominis de dades</a>
    <a role="tab" class="tab whitespace-nowrap" routerLink="conjunts-dades" routerLinkActive="tab-active font-bold text-primary border-primary">Conjunts de dades</a>
    <a role="tab" class="tab whitespace-nowrap" routerLink="relacio-conjunts-sistemes" routerLinkActive="tab-active font-bold text-primary border-primary">Rel. Conjunts-Sistemes</a>
    <a role="tab" class="tab whitespace-nowrap" routerLink="qualitat" routerLinkActive="tab-active font-bold text-primary border-primary">Qualitat</a>
    <a role="tab" class="tab informative-tab whitespace-nowrap" routerLink="llegenda" routerLinkActive="tab-active font-bold border-primary" (focus)="showInfoTooltip($event)" (blur)="hideInfoTooltip()">
      Llegenda
      <span class="info-badge" aria-label="Són només informatives" (mouseenter)="showInfoTooltip($event)" (mouseleave)="hideInfoTooltip()">i</span>
    </a>
    <a role="tab" class="tab informative-tab whitespace-nowrap" routerLink="relacio-inventaris" routerLinkActive="tab-active font-bold border-primary" (focus)="showInfoTooltip($event)" (blur)="hideInfoTooltip()">
      Relació inventaris
      <span class="info-badge" aria-label="Són només informatives" (mouseenter)="showInfoTooltip($event)" (mouseleave)="hideInfoTooltip()">i</span>
    </a>
    <a role="tab" class="tab informative-tab whitespace-nowrap" routerLink="llistes" routerLinkActive="tab-active font-bold border-primary" (focus)="showInfoTooltip($event)" (blur)="hideInfoTooltip()">
      Llistes
      <span class="info-badge" aria-label="Són només informatives" (mouseenter)="showInfoTooltip($event)" (mouseleave)="hideInfoTooltip()">i</span>
    </a>
    <a role="tab" class="tab informative-tab whitespace-nowrap" routerLink="instruccions" routerLinkActive="tab-active font-bold border-primary" (focus)="showInfoTooltip($event)" (blur)="hideInfoTooltip()">
      Instruccions
      <span class="info-badge" aria-label="Són només informatives" (mouseenter)="showInfoTooltip($event)" (mouseleave)="hideInfoTooltip()">i</span>
    </a>
  </div>

  @if (infoTooltipVisible) {
    <div
      class="information-tooltip"
      role="tooltip"
      [style.left.px]="infoTooltipLeft"
      [style.top.px]="infoTooltipTop">
      Són només informatives
    </div>
  }

  <div class="mt-2 bg-base-100 p-6 rounded-2xl shadow-sm border border-base-200 flex-1">
    <router-outlet></router-outlet>
  </div>
</div>
